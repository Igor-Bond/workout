# Проверки на каждый push и на каждый pull request.
#
# Зачем. Ветка main — это то, что лежит на Pages, и между `git push` и живым
# адресом раньше не было ничего: решение «выкатывать или нет» принимал
# человек, посмотревший на заголовок вкладки. Сломанный коммит доезжал до
# людей, а сервис-воркер разносил его по устройствам.
#
# Что здесь важно понимать про зависимости. Приложение остаётся без сборки и
# без пакетов — это его свойство, а не недосмотр: через пять лет index.html
# просто откроется. Playwright ставится здесь, в рабочем каталоге бегунка, и
# в репозиторий не попадает. Версия закреплена: обновлять её — осознанное
# действие, а не сюрприз в понедельник.

name: Проверки

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Браузерные проверки
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --no-save: package.json в проекте нет и заводить его незачем
      - name: Поставить браузер
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      # Тот же статический сервер, что и у разработки: модули ES и
      # сервис-воркер через file:// не работают
      - name: Поднять сервер
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/index.html > /dev/null && break
            sleep 1
          done

      - name: Прогнать проверки
        run: node tools/ci-tests.mjs http://127.0.0.1:4173/tests/index.html

  precache:
    name: Список офлайн-кэша
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Забытый в PRECACHE_URLS файл ломает офлайн молча: в сети всё
      # работает, а без сети приложение не открывается — и узнаётся это в
      # зале, где связи нет
      - name: Сверить PRECACHE_URLS с деревом проекта
        shell: pwsh
        run: ./tools/check-precache.ps1
